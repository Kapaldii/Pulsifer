</head>

<body>

    <main class="form-section">

  <h1>Fale com a gente</h1>
  <p class="subtitulo">Preencha o formulário e entraremos em contato</p>


<div class="form-card">
   <form method="post">

    <div class="campo">
     <label>Nome</label>
      <input type="text" placeholder="Seu nome" required>
    </div>

    <div class="campo">
     <label>Email</label>
      <input type="email" placeholder="Seu email" required>
    </div>

    <div class="campo">
     <label>Telefone</label>
      <input type="tel" id="telefone" placeholder="+55 (11) 99999-9999">
    </div>

  <!-- CEP -->
    <div class="campo">
     <label>CEP</label>
      <input type="text" id="cep" maxlength="9" inputmode="numeric" placeholder="Digite o CEP">
    </div>

  <!-- Endereço -->
    <div class="campo">
     <label>Rua</label>
      <input type="text" id="rua">
    </div>

      <!-- Númeero
  <div class="campo">
    <label>Número</label>
    <input type="text" id="numero">
  </div> -->

   <div class="linha-dupla">
    <div class="campo">
     <label for="numero">Número</label>
      <input type="number" id="numero" min="0" placeholder="Número">
    </div>

    <div class="campo">
     <label>Complemento</label>
      <input type="text" placeholder="Apto, bloco, etc">
    </div>
  </div>

  <div class="campo">
    <label>Bairro</label>
    <input type="text" id="bairro">
  </div>

  <div class="campo">
    <label>Cidade</label>
    <input type="text" id="cidade">
  </div>

  <div class="campo">
    <label>Estado</label>
    <input type="text" id="estado">
  </div>

  <div class="campo">
    <label>Mensagem</label>
    <textarea rows="4" placeholder="Digite sua mensagem"></textarea>
  </div>
 </div>

  <button type="submit">Enviar mensagem</button>

</form>
 
</main>

<script src="JS/contato.js"></script>
</body>
</html>
